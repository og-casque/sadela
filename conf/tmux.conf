set-option -g default-shell /bin/zsh
set -g mouse on
set -g history-limit 100000
set -g mode-keys vi

# Activer le clipboard externe
set -g set-clipboard on

# Utiliser xclip SANS quitter le mode copie
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter send -X copy-pipe "xclip -in -selection clipboard"
bind -T copy-mode-vi y send -X copy-pipe "xclip -in -selection clipboard"

set -g status-right "#(ip -4 -o addr show scope global | awk '{split(\$4, a, \"/\"); print \"[\" a[1] \"]\"}' | tr '\n' ' ')"